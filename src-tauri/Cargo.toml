[package]
name = "lyrics-everywhere"
version = "0.1.0"
description = "Lyrics Everywhere desktop companion"
authors = ["Lyrics Everywhere"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "query"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Control"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
