name: Extension release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - name: Verify manifest version matches tag
        run: node -e "const v=JSON.parse(require('fs').readFileSync('browser-extension/manifest.json','utf8')).version; if ('v'+v!==process.argv[1]) { console.error('manifest version '+v+' does not match tag '+process.argv[1]); process.exit(1); }" "${{ inputs.tag }}"
      - run: pnpm run package:extension
      - name: Verify zip root contains manifest.json
        run: unzip -Z1 release/lyrics-everywhere-extension.zip | grep -qx manifest.json
      - name: Stage release artifacts
        run: mv release/lyrics-everywhere-extension.zip "release/lyrics-everywhere-extension-${{ inputs.tag }}.zip" && (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Lyrics Everywhere ${{ inputs.tag }}
          files: release/*
          draft: true
