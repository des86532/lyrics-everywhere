name: CI

on:
  push:
    branches: [main]
  pull_request:

# Feature-branch pushes are already covered by the pull_request run; running both
# doubled the load on the runners, which left jobs queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - name: Verify manifest version matches package version
        run: node -e "const m=JSON.parse(require('fs').readFileSync('browser-extension/manifest.json','utf8')).version; const p=JSON.parse(require('fs').readFileSync('package.json','utf8')).version; if (m!==p) { console.error('browser-extension/manifest.json version '+m+' does not match package.json version '+p); process.exit(1); }"
      - run: pnpm run package:extension
