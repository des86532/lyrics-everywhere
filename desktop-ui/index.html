<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Lyrics Everywhere — 全曲跟唱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; --canvas: #0b1017; --surface: #151e2a; --raised: #1b2735; --line: #2b3948; --ink: #e8edf2; --muted: #98a5b3; --sync: #89ced1; --phonetic: #ddbb78; --font-ui: "Avenir Next", "Segoe UI Variable", "Noto Sans TC", system-ui, sans-serif; --font-data: "SF Mono", "Cascadia Code", Consolas, monospace; font-family: var(--font-ui); font-synthesis: none; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); }
    button, input { font: inherit; }
    button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--sync); outline-offset: 3px; }
    .workspace { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: 100%; height: 100%; min-height: 0; padding: 26px clamp(24px, 5vw, 68px) 20px; background: radial-gradient(ellipse at 50% 42%, #182534 0%, var(--canvas) 68%); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .track-meta { min-width: 0; }
    .eyebrow { margin: 0 0 7px; color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .track-title { overflow: hidden; color: var(--ink); font-size: clamp(1.15rem, 2vw, 1.45rem); font-weight: 650; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
    .track-artist { margin-top: 4px; color: var(--muted); font-size: .9rem; }
    .topbar-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
    .status-badge { display: inline-flex; align-items: center; gap: 9px; min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: #111a24; color: var(--muted); font-size: .8rem; font-weight: 650; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status-badge[data-state="playing"] { border-color: #89ced155; color: var(--sync); }
    .status-badge[data-state="paused"] { border-color: #ddbb7855; color: var(--phonetic); }
    .preferences { position: relative; }
    .preferences summary { display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); cursor: pointer; font-size: .82rem; font-weight: 650; list-style: none; }
    .preferences summary::-webkit-details-marker { display: none; }
    .preferences summary::after { content: "⌄"; margin-left: 9px; color: var(--sync); }
    .preferences[open] summary::after { content: "⌃"; }
    .preferences-panel { position: absolute; z-index: 20; top: calc(100% + 10px); right: 0; width: min(340px, calc(100vw - 32px)); padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 20px 55px #0009; }
    .preferences-panel fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .preferences-panel fieldset + fieldset { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .preferences-panel legend { margin-bottom: 11px; color: var(--ink); font-size: .84rem; font-weight: 650; }
    .preference-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .preference-option { display: inline-flex; align-items: center; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: .8rem; }
    .preference-option:has(input:checked) { border-color: #89ced177; background: #89ced116; color: var(--ink); }
    .preference-option input { margin: 0 7px 0 0; accent-color: var(--sync); }
    .preference-note { margin: 12px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.55; }
    .lyrics-region { position: relative; display: flex; min-height: 0; flex-direction: column; }
    .lyrics-heading { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 2px; }
    .lyrics-heading h2 { margin: 0; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .lyrics-sheet-container { flex: 1; min-height: 0; overflow-y: auto; padding: 22px clamp(4px, 5vw, 72px) 42px; scroll-behavior: smooth; scrollbar-color: #455464 transparent; scrollbar-width: thin; }
    .lyric-row { position: relative; margin: 7px 0; padding: 16px 20px; border-radius: 9px; text-align: center; opacity: .68; transition: background-color .22s ease, opacity .22s ease; }
    .lyric-row.active { border-left: 2px solid var(--sync); background: linear-gradient(90deg, #89ced11b, #89ced108 65%, transparent); opacity: 1; }
    .original-text { color: #c3cbd4; font-size: clamp(1.2rem, 2.4vw, 1.65rem); font-weight: 560; line-height: 1.55; letter-spacing: .015em; overflow-wrap: anywhere; }
    .lyric-row.active .original-text { color: var(--ink); font-weight: 720; }
    .blended-homophone { margin-top: 7px; color: var(--phonetic); font-size: clamp(.98rem, 1.8vw, 1.15rem); font-weight: 600; line-height: 1.5; letter-spacing: .035em; overflow-wrap: anywhere; }
    .lyric-row:not(.active) .blended-homophone { color: #c4a96f; }
    .empty-state { max-width: 460px; margin: auto; padding: 40px 24px; color: var(--muted); text-align: center; line-height: 1.7; }
    .empty-state strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 1.05rem; font-weight: 650; }
    .btn-return-sync { position: absolute; z-index: 5; right: 18px; bottom: 16px; display: none; min-height: 40px; padding: 0 15px; border: 1px solid #89ced177; border-radius: 9px; background: #172530; color: var(--sync); cursor: pointer; font-size: .82rem; font-weight: 650; }
    .btn-return-sync:hover { background: #203642; }
    .playback-footer { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; align-items: center; gap: 15px; padding-top: 15px; border-top: 1px solid var(--line); color: var(--muted); font: 12px var(--font-data); font-variant-numeric: tabular-nums; }
    .progress-track { height: 4px; overflow: hidden; border-radius: 99px; background: #34414e; }
    .progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--sync); transition: width .35s linear; }
    @media (max-width: 760px) {
      .workspace { padding: 18px 18px 14px; }
      .topbar { align-items: flex-start; gap: 12px; padding-bottom: 15px; }
      .topbar-actions { gap: 7px; }
      .status-badge { min-height: 34px; padding: 0 10px; font-size: .72rem; }
      .preferences summary { min-height: 34px; padding: 0 10px; font-size: .75rem; }
      .lyrics-sheet-container { padding: 14px 2px 38px; }
      .lyric-row { padding: 14px 10px; }
      .playback-footer { gap: 9px; padding-top: 12px; }
    }
    @media (max-width: 520px) {
      .workspace { padding: 14px 13px 12px; }
      .topbar { flex-wrap: wrap; }
      .track-meta { width: 100%; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .lyrics-heading { padding-top: 13px; }
      .lyrics-sheet-container { padding-top: 9px; }
      .lyric-row { padding-inline: 5px; }
      .playback-footer { grid-template-columns: auto minmax(40px, 1fr) auto; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="workspace">
    <header class="topbar">
      <div class="track-meta">
        <p class="eyebrow">Lyrics Everywhere · Local listening</p>
        <h1 id="title" class="track-title">等待播放</h1>
        <p id="artist" class="track-artist">在支援的桌面播放器或 Chrome YouTube 開始播放</p>
      </div>
      <div class="topbar-actions">
        <div id="badge" class="status-badge" data-state="waiting" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="badge-text">等待播放資訊</span>
        </div>
        <details class="preferences">
          <summary aria-label="開啟顯示偏好">顯示偏好</summary>
          <div class="preferences-panel">
            <fieldset>
              <legend>保留原文語言</legend>
              <div class="preference-options">
                <label class="preference-option"><input class="preserved-language" name="preserved-language" type="checkbox" value="zh" checked onchange="updateLanguages(event)">中文</label>
                <label class="preference-option"><input class="preserved-language" name="preserved-language" type="checkbox" value="en" onchange="updateLanguages(event)">英文</label>
                <label class="preference-option"><input class="preserved-language" name="preserved-language" type="checkbox" value="ja" onchange="updateLanguages(event)">日文</label>
                <label class="preference-option"><input class="preserved-language" name="preserved-language" type="checkbox" value="ko" onchange="updateLanguages(event)">韓文</label>
              </div>
              <p class="preference-note">選取的語言保留原文；其他語言會依下方設定轉寫。至少保留一種語言。</p>
            </fieldset>
            <fieldset>
              <legend>空耳顯示方式</legend>
              <div class="preference-options">
                <label class="preference-option"><input type="radio" name="phonetic-system" value="chinese" checked onchange="updateSystems()">漢字</label>
                <label class="preference-option"><input type="radio" name="phonetic-system" value="latin" onchange="updateSystems()">英文字母</label>
                <label class="preference-option"><input type="radio" name="phonetic-system" value="bopomofo" onchange="updateSystems()">注音</label>
              </div>
            </fieldset>
          </div>
        </details>
      </div>
    </header>
    <section class="lyrics-region" aria-labelledby="lyrics-heading">
      <div class="lyrics-heading">
        <h2 id="lyrics-heading">同步歌詞</h2>
        <span class="eyebrow" aria-hidden="true">Follow the line</span>
      </div>
      <div id="lyrics-sheet" class="lyrics-sheet-container" tabindex="0" aria-label="全曲同步歌詞">
        <div class="empty-state"><strong>歌詞準備中</strong>正在等待播放資訊與同步歌詞。</div>
      </div>
      <button id="btn-return" class="btn-return-sync" type="button" onclick="returnToPlaying()">回到目前段落</button>
    </section>
    <footer class="playback-footer" aria-label="歌曲播放進度">
      <span id="time-info">00:00</span>
      <div id="progress-track" class="progress-track" role="progressbar" aria-label="歌曲進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill" class="progress-fill"></span></div>
      <span id="duration-info">--:--</span>
    </footer>
  </main>

  <script type="module">
    import { transcribeDisplayText } from "/assets/ui/transcriber-entry.js";
    window.transcribeDisplayText = transcribeDisplayText;
  </script>
  <script>
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const sheetEl = document.getElementById("lyrics-sheet");
    const badgeEl = document.getElementById("badge");
    const badgeTextEl = document.getElementById("badge-text");
    const timeInfoEl = document.getElementById("time-info");
    const durationInfoEl = document.getElementById("duration-info");
    const progressTrackEl = document.getElementById("progress-track");
    const progressFillEl = document.getElementById("progress-fill");
    const btnReturnEl = document.getElementById("btn-return");

    let currentSheet = null;
    let activeIndex = -1;
    let manualScrollLockTimer = null;
    let isUserScrolling = false;

    function formatClock(milliseconds) {
      const totalSeconds = Math.floor(Math.max(0, Number(milliseconds) || 0) / 1000);
      return String(Math.floor(totalSeconds / 60)).padStart(2, "0") + ":" + String(totalSeconds % 60).padStart(2, "0");
    }

    function showEmptyState(title, message, state) {
      if (sheetEl.dataset.state === state) return;
      const notice = document.createElement("div");
      notice.className = "empty-state";
      const heading = document.createElement("strong");
      heading.textContent = title;
      notice.append(heading, document.createTextNode(message));
      sheetEl.replaceChildren(notice);
      sheetEl.dataset.state = state;
    }


    // 監聽使用者手動滾動 (4 秒防干擾保護)
    sheetEl.addEventListener("wheel", triggerManualScroll);
    sheetEl.addEventListener("touchstart", triggerManualScroll);

    function triggerManualScroll() {
      isUserScrolling = true;
      btnReturnEl.style.display = "block";

      if (manualScrollLockTimer) clearTimeout(manualScrollLockTimer);
      manualScrollLockTimer = setTimeout(() => {
        isUserScrolling = false;
        btnReturnEl.style.display = "none";
      }, 4000);
    }

    function returnToPlaying() {
      isUserScrolling = false;
      btnReturnEl.style.display = "none";
      scrollToActiveLine();
    }

    function scrollToActiveLine() {
      if (isUserScrolling) return;
      const activeEl = document.querySelector(".lyric-row.active");
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    async function updateLanguages(event) {
      const preservedLanguages = Array.from(document.querySelectorAll(".preserved-language:checked"))
        .map((input) => input.value);
      if (preservedLanguages.length === 0) {
        event.currentTarget.checked = true;
        return;
      }

      const [primaryLanguage, ...passthroughLanguages] = preservedLanguages;
      const targetLocale = primaryLanguage === "zh" ? "zh-TW" : primaryLanguage;
      await fetch("/api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ targetLocale, passthroughLanguages })
      });
    }

    async function updateSystems() {
      const selected = document.querySelector('input[name="phonetic-system"]:checked')?.value || "chinese";
      await fetch("/api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ allowedSystems: [selected] })
      });
    }

    const events = new EventSource("/events");

    // 1. 接收全篇歌譜清單 (換歌或偏好切換時整批推播)
    events.addEventListener("lyrics-sheet", (e) => {
      const data = JSON.parse(e.data);
      if (data.track) {
        titleEl.textContent = data.track.title;
        artistEl.textContent = data.track.artists.join(", ");
      }

      currentSheet = data.sheet;
      renderFullSheet(currentSheet);
    });

    // 2. 接收每秒輕量游標更新
    events.addEventListener("playback-update", (e) => {
      const data = JSON.parse(e.data);
      const cursor = data.cursor;

      if (!cursor.trackKey) {
        badgeEl.dataset.state = "waiting";
        badgeTextEl.textContent = "等待播放資訊";
        titleEl.textContent = "尚未偵測到媒體工作階段";
        artistEl.textContent = "請在支援的桌面播放器或 Chrome YouTube 開始播放";
        showEmptyState("尚未偵測到播放資訊", "播放器需公開歌曲標題與歌手，才能同步歌詞。", "waiting");
        timeInfoEl.textContent = "00:00";
        durationInfoEl.textContent = "--:--";
        progressFillEl.style.width = "0%";
        progressTrackEl.setAttribute("aria-valuenow", "0");
        return;
      }
      badgeEl.dataset.state = cursor.isPlaying ? "playing" : "paused";
      badgeTextEl.textContent = cursor.isPlaying ? "播放中" : "暫停";
      timeInfoEl.textContent = formatClock(cursor.positionMs);
      durationInfoEl.textContent = cursor.durationMs ? formatClock(cursor.durationMs) : "--:--";
      const progress = Math.max(0, Math.min(100, Number(cursor.progressPercent) || 0));
      progressFillEl.style.width = progress + "%";
      progressTrackEl.setAttribute("aria-valuenow", String(progress));

      if (cursor.currentLineIndex !== activeIndex) {
        updateActiveLine(cursor.currentLineIndex);
      }
    });

    function renderFullSheet(sheet) {
      if (!sheet || !sheet.lines || sheet.lines.length === 0) {
        const message = sheet?.status === "loading"
          ? "正在查詢同步歌詞…"
          : sheet?.status === "unavailable"
            ? "沒有可用的同步歌詞。播放資訊會用來向 LRCLIB 查詢歌詞。"
            : null;
        if (message) {
          const isLoading = sheet.status === "loading";
          showEmptyState(isLoading ? "正在尋找歌詞" : "找不到同步歌詞", message, isLoading ? "lyrics-loading" : "lyrics-unavailable");
        }
        return;
      }

      sheetEl.dataset.state = "lyrics";
      sheetEl.replaceChildren();
      sheet.lines.forEach((line, idx) => {
        const row = document.createElement("div");
        row.className = "lyric-row" + (idx === activeIndex ? " active" : "");
        row.id = "line-" + idx;

        const origDiv = document.createElement("div");
        origDiv.className = "original-text";
        origDiv.textContent = line.originalText;

        const pronDiv = document.createElement("div");
        pronDiv.className = "blended-homophone";
        const systems = [document.querySelector('input[name="phonetic-system"]:checked')?.value || "chinese"];
        const preserved = Array.from(document.querySelectorAll(".preserved-language:checked")).map((input) => input.value);
        const [primaryLanguage, ...passthrough] = preserved;
        const targetLocale = primaryLanguage === "zh" ? "zh-TW" : primaryLanguage || "zh-TW";
        pronDiv.textContent = line.pronunciation?.displayText || window.transcribeDisplayText?.(line.originalText, systems, targetLocale, passthrough) || "";

        row.appendChild(origDiv);
        row.appendChild(pronDiv);
        sheetEl.appendChild(row);
      });

      scrollToActiveLine();
    }

    function updateActiveLine(newIndex) {
      if (activeIndex >= 0) {
        const prevActive = document.getElementById("line-" + activeIndex);
        if (prevActive) prevActive.classList.remove("active");
      }

      activeIndex = newIndex;
      if (activeIndex !== null && activeIndex >= 0) {
        const currentActive = document.getElementById("line-" + activeIndex);
        if (currentActive) {
          currentActive.classList.add("active");
          scrollToActiveLine();
        }
      }
    }
  </script>
</body>
</html>
